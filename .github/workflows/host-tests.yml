# padavan-tw：在一般 Linux 上跑的模擬測試（不需要交叉編譯工具鏈，幾十秒內完成）
name: Host Tests

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "trunk/user/rc/src/tw_roam*"
      - "trunk/user/rc/tests/**"
      - ".github/workflows/host-tests.yml"
  workflow_dispatch:

jobs:
  tw-roamd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            trunk/user/rc
      - name: tw-roamd 模擬測試（同一台裝置留在兩個頻段的表裡）
        run: sh trunk/user/rc/tests/tw-roamd-host-test.sh
