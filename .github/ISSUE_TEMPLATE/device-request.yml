name: 機型支援請求
description: 想在其他路由器上使用 padavan-tw？請在這裡提出
title: "[機型請求] "
labels: ["device-request"]
body:
  - type: markdown
    attributes:
      value: |
        padavan-tw 正式維護 **Newifi D3（NEWIFI3）** 與**小米 CR6608（CR660x）**。
        README「支援機型」表裡的其他機型都可以編譯，但維護者手邊沒有機器，**沒有實機測試**。

        提出請求後，維護者會幫你編譯並發布這個機型的測試版 Release；
        你也可以照 README 的「自己編譯其他機型」一節，用 GitHub Actions 自己編，不需要等待。
  - type: dropdown
    id: target
    attributes:
      label: 編譯名稱
      description: 對應 trunk/configs/templates/ 裡的設定檔名稱；清單裡沒有的機型請選「其他（新機型）」
      options:
        - 其他（新機型）
        - 360-T6M
        - 360-T6M-PB
        - B70
        - BELL-A040WQ
        - C-Life-XG1
        - DIR-878
        - DIR-882
        - EA7500
        - G-AX1800
        - G-AX1800-B
        - GHL
        - HAR-20S2U1
        - JCG-836PRO
        - JCG-AC860M
        - JCG-Q10Pro
        - JCG-Q10Pro-PB
        - JCG-Q11Pro
        - JCG-Q20
        - JCG-Q20-PB
        - JCG-Y2
        - JDCLOUD-RE-CP-02
        - JDCLOUD-RE-SP-01B
        - K2P
        - K2P-NANO
        - K2P-USB
        - KOMI-A8
        - MI-4
        - MI-R3G
        - MI-R3P
        - MI-R3P-PB
        - MI-R3P-SPI
        - MI-R4A
        - MR2600
        - MSG1500
        - MSG1500-Z
        - NETGEAR-BZV
        - NETGEAR-R6800
        - NETGEAR-R7450
        - NEWIFI
        - QM-B1
        - R2100
        - RM2100
        - RT-AC85P
        - SIM-AX1800T
        - TX1801
        - WDR8620
        - WE410443-TC
        - WIA3300-10
        - WR1200JS
        - WRL18M4GD
        - XY-C1
        - ZTE-E8820S
        - ZTE-E8820V2
        - ZTT-RX6000
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 路由器品牌與完整型號（含硬體版本）
      placeholder: 例如：小米 Redmi AC2100、斐訊 K2P A1
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: 硬體資訊
      description: 新機型請盡量提供；已在清單上的機型可以略過
      placeholder: |
        SoC：MT7621A
        無線晶片：MT7603E + MT7612E
        Flash：NOR 32 MB / NAND 128 MB
        RAM：256 MB
        Bootloader：Breed / pb-boot / 原廠 U-Boot
        OpenWrt 或其他 Padavan 分支的支援連結：
  - type: textarea
    id: needs
    attributes:
      label: 用途與特別需求
      placeholder: 例如：中華電信 PPPoE、需要 MOD、要當 AP、想用 SQM…
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 我了解社群支援機型沒有經過維護者實機測試，刷機有變磚風險，我有救援方式（Breed、TTL 或編程器）
          required: true
        - label: 測試後我會回報結果（可以開機、有線、無線、硬體 NAT 是否正常）
          required: false
